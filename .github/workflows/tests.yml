name: Synthetic-data tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install test requirements (CPU-only PyTorch, CatBoost, Optuna)
        run: |
          python -m pip install -r requirements-test.txt -r requirements-improve.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Run tests without competition data
        run: python -m unittest discover -s tests -v
